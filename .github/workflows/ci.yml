name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - run: python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0 wheel==0.46.2
      - run: pip install -c constraints-ci.txt -e . ruff pytest
      - run: ruff check src tests tools
      - run: python -m pytest -q
      - name: Audit full Git history for public release
        run: python tools/audit_public_history.py
