[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agf-orchestrator"
version = "0.1.0"
description = "Vendor-neutral orchestration contracts and Director runtime for AGF-Orchestrator"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0,<2.0", "cryptography>=42,<46"]

[project.scripts]
agf-orchestrator = "agf_orchestrator.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
