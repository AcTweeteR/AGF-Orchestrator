site_name: AGF-Orchestrator
site_description: Provider-neutral governance and orchestration for autonomous software-development agents.
site_url: https://actweeter.github.io/AGF-Orchestrator/
repo_url: https://github.com/AcTweeteR/AGF-Orchestrator
repo_name: AcTweeteR/AGF-Orchestrator
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting Started: GETTING_STARTED.md
  - Architecture:
      - Overview: ARCHITECTURE.md
      - Vision: VISION.md
      - Execution Model: EXECUTION_MODEL.md
      - Workflow Engine: WORKFLOW_ENGINE.md
      - Task Model: TASK_MODEL.md
      - Decision Model: DECISION_MODEL.md
      - Adapter Model: ADAPTER_MODEL.md
      - Context Protocol: CONTEXT_PROTOCOL.md
  - Governance:
      - Constitution: CONSTITUTION.md
      - Human Intervention: HUMAN_INTERVENTION.md
      - Review Pipeline: REVIEW_PIPELINE.md
      - Failure Model: FAILURE_MODEL.md
      - Escalation Protocol: ESCALATION_PROTOCOL.md
      - Threat Model: THREAT_MODEL.md
  - Roles:
      - Agent Roles: AGENT_ROLES.md
      - Director: DIRECTOR.md
      - Architect: ARCHITECT_ROLE.md
      - Compliance Officer: COMPLIANCE_OFFICER.md
  - Autonomy:
      - Autonomous Director: AUTONOMOUS_DIRECTOR.md
      - Persistent Campaign Runner: PERSISTENT_CAMPAIGN_RUNNER.md
      - Autonomous Roadmap: AUTONOMOUS_ROADMAP.md
      - Roadmap: ROADMAP.md
  - Decisions:
      - ADR Index: adr/README.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AcTweeteR/AGF-Orchestrator

copyright: Apache-2.0 licensed open-source project. Experimental, pre-1.0 software.
